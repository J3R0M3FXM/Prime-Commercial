name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/android-release-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false
      VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build:android:web
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: prime-services-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
