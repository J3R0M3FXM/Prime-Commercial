name: Oracle branch dependency and build gate

on:
  push:
    branches:
      - stabilize/oracle-deployment
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-dependency-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: ''

      - name: Generate lockfile and pin floating direct dependencies
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          let changed = false;
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            for (const [name, spec] of Object.entries(manifest[section] || {})) {
              if (spec !== 'latest') continue;
              const entry = lock.packages?.['node_modules/' + name];
              if (!entry?.version) {
                console.error('Cannot resolve floating dependency:', name);
                process.exit(1);
              }
              manifest[section][name] = entry.version;
              console.log('Pinned', name, 'to', entry.version);
              changed = true;
            }
          }
          if (changed) fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (l.packages?.['']?.version !== p.version) {
            console.error('Manifest/lockfile package version mismatch');
            process.exit(1);
          }
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            for (const [name, spec] of Object.entries(p[section] || {})) {
              if (spec === 'latest') {
                console.error('Floating dependency remains:', name);
                process.exit(1);
              }
            }
          }
          console.log('Manifest and lockfile root metadata match; no latest dependency ranges remain.');
          NODE

      - name: Commit generated reproducible dependency files to this PR branch
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "build: synchronize and pin dependency lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Dependency files are already synchronized."
          fi

      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
