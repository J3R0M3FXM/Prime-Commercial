name: Oracle staging dependency and build gate

on:
  push:
    branches:
      - oracle/staging-host
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'app/**'
      - 'src/**'
      - 'next.config.mjs'
      - '.github/workflows/oracle-staging-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-staging-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install from committed lockfile
        run: bun install --frozen-lockfile

      - name: Reject floating direct dependency versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            for (const [name, version] of Object.entries(p[section] || {})) {
              if (version === 'latest' || version === '*') {
                console.error('Unpinned direct dependency:', name, version);
                process.exit(1);
              }
            }
          }
          console.log('No floating direct dependency versions found.');
          NODE

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
