name: Telegram Serverless Schema Check
on:
  push:
    branches: [migration/telegram-serverless]
    paths:
      - "tgcloud/schema.js"
      - "tgcloud/endpoints/**"
      - "tgcloud/lib/**"
      - "scripts/check-telegram-serverless-contracts.mjs"
      - "scripts/export-supabase-snapshot.mjs"
      - "scripts/verify-supabase-snapshot.mjs"
      - ".github/workflows/telegram-serverless-schema-check.yml"
  pull_request:
    branches: [migration/telegram-serverless]
    paths:
      - "tgcloud/schema.js"
      - "tgcloud/endpoints/**"
      - "tgcloud/lib/**"
      - "scripts/check-telegram-serverless-contracts.mjs"
      - ".github/workflows/telegram-serverless-schema-check.yml"

jobs:
  schema-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check schema JavaScript syntax
        run: node --input-type=module --check < tgcloud/schema.js
      - name: Check migration schema and public endpoint contracts
        run: node scripts/check-telegram-serverless-contracts.mjs
      - name: Check backup utility syntax
        run: |
          node --check scripts/export-supabase-snapshot.mjs
          node --check scripts/verify-supabase-snapshot.mjs
