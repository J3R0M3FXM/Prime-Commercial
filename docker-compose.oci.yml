services:
  prime-commercial:
    image: ghcr.io/j3r0m3fxm/prime-commercial:main
    container_name: prime-commercial
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      ALLOW_PREVIEW_AUTH: "false"
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/auth/telegram/validate').then(r => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
