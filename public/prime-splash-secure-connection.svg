<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 0 770 400" role="img" aria-labelledby="title desc">
<title id="title">Secure Telegram connection to PRIME servers</title>
<desc id="desc">A Telegram phone connects through moving green dots and a shield with a lock to three blue server towers. Layered blue clouds drift behind the devices and each server light blinks independently.</desc>
<style>
.phone{animation:float 4s ease-in-out infinite}.server{animation:float 5s ease-in-out -1.5s infinite}.server-right{animation-delay:-3s}.server-front{animation-duration:4.5s;animation-delay:-.8s}
.cloud-back{animation:cloud-drift 12s ease-in-out infinite alternate}.cloud-middle{animation:cloud-drift 15s ease-in-out -6s infinite alternate-reverse}.cloud-front{animation:cloud-drift 9s ease-in-out -4s infinite alternate-reverse}
.connection{stroke-dasharray:1 25;animation:flow 1.8s ease-in-out infinite alternate}
.light{animation:var(--blink-pattern,blink-a) var(--blink-duration,2.2s) steps(1,end) var(--blink-delay,0s) infinite;filter:url(#light-glow)}
.lock{animation:pulse 3s ease-in-out infinite;transform-origin:500px 207px}
@keyframes cloud-drift{from{transform:translate(-16px,4px)}to{transform:translate(16px,-5px)}}
@keyframes float{50%{transform:translateY(-5px)}}@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-52}}@keyframes blink-a{0%,14%,63%,100%{opacity:1}15%,29%{opacity:.15}30%,36%{opacity:.9}37%,62%{opacity:.25}}
@keyframes blink-b{0%,9%,67%,100%{opacity:.2}10%,44%,59%,66%{opacity:1}45%,58%{opacity:.4}}
@keyframes blink-c{0%,23%,32%,39%,77%,100%{opacity:1}24%,31%{opacity:.3}40%,76%{opacity:.2}}@keyframes pulse{50%{transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){.phone,.server,.connection,.light,.lock,.cloud-back,.cloud-middle,.cloud-front{animation:none!important}}
</style>
<defs>
<linearGradient id="phone-body" x2="1" y2="1"><stop stop-color="#153c53"/><stop offset=".5" stop-color="#0a2639"/><stop offset="1" stop-color="#123b50"/></linearGradient>
<linearGradient id="screen" x2="1" y2="1"><stop stop-color="#f6fdff"/><stop offset="1" stop-color="#e3f5f9"/></linearGradient>
<linearGradient id="server-body" x1="0" y1="0" x2="0.2" y2="1"><stop stop-color="#2867c2"/><stop offset=".09" stop-color="#103670"/><stop offset=".6" stop-color="#071f4f"/><stop offset="1" stop-color="#02122e"/></linearGradient>
<linearGradient id="server-bay" x2=".5" y2="1"><stop stop-color="#193f7a"/><stop offset="1" stop-color="#071d44"/></linearGradient>
<linearGradient id="cloud-blue" x2=".2" y2="1"><stop stop-color="#dcefff"/><stop offset="1" stop-color="#cde6fa"/></linearGradient>
<linearGradient id="cloud-white" x2=".1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#e0f1ff"/></linearGradient>
<linearGradient id="shield-fill" x2="0" y2="1"><stop stop-color="#effff9"/><stop offset="1" stop-color="#d9faed"/></linearGradient>
<linearGradient id="lock-fill" x2="1" y2="1"><stop stop-color="#0c9f58"/><stop offset="1" stop-color="#13ca68"/></linearGradient>
<linearGradient id="bottom-fade" x2="0" y2="1"><stop stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient>
<filter id="shadow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="light-glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
