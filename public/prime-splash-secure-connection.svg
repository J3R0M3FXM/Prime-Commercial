<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Secure phone and server connection</title><desc id="desc">Signals travel in both directions between a Telegram phone and a dark server with blinking lights, protected by a central lock.</desc>
<style>
.phone{animation:float 4s ease-in-out infinite}.server{animation:float 5s ease-in-out -1.5s infinite}.halo{animation:halo 3s ease-in-out infinite;transform-origin:239px 238px}.connection{stroke-dasharray:5 13;animation:flow 1.3s linear infinite}.reverse{animation-direction:reverse}.light{animation:blink 2.2s ease-in-out infinite;filter:url(#light-glow)}.light:nth-child(2n){animation-delay:-.8s}.light:nth-child(3n){animation-delay:-1.6s}.light:nth-child(5n){animation-duration:3.1s}.lock{animation:pulse 3s ease-in-out infinite;transform-origin:505px 241px}.signal{filter:url(#signal-glow);animation:signal 2.8s linear infinite}.signal.inbound{animation-duration:3.2s;animation-delay:-1.1s}.signal.bottom{animation-delay:-2s}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes halo{50%{opacity:.35;transform:scale(1.08)}}@keyframes flow{to{stroke-dashoffset:-36}}@keyframes blink{0%,100%{opacity:1}43%{opacity:.22}56%{opacity:1}73%{opacity:.46}}@keyframes pulse{50%{transform:scale(1.06)}}@keyframes signal{0%,100%{opacity:0}12%,85%{opacity:1}}
@media(prefers-reduced-motion:reduce){.phone,.server,.halo,.connection,.light,.lock,.signal{animation:none!important}.signal{display:none}}
</style>
<defs>
<linearGradient id="phone-body" x2="1" y2="1"><stop stop-color="#334e60"/><stop offset="1" stop-color="#112b3c"/></linearGradient>
<linearGradient id="screen" x2="1" y2="1"><stop stop-color="#f4fcff"/><stop offset="1" stop-color="#dcf3f7"/></linearGradient>
<linearGradient id="server-body" x2="1" y2="1"><stop stop-color="#152334"/><stop offset=".55" stop-color="#0b1625"/><stop offset="1" stop-color="#050d19"/></linearGradient>
<linearGradient id="server-bay" x2="1" y2="1"><stop stop-color="#1b2d40"/><stop offset="1" stop-color="#0c1928"/></linearGradient>
<filter id="shadow" x="-40%" y="-50%" width="180%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
<filter id="light-glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="signal-glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><ellipse cx="240" cy="411" rx="114" ry="17" fill="#6999a6" opacity=".12" filter="url(#shadow)"/><ellipse cx="758" cy="411" rx="128" ry="17" fill="#456478" opacity=".16" filter="url(#shadow)"/><circle class="halo" cx="239" cy="238" r="151" fill="#d8f6f2" opacity=".42"/><circle cx="239" cy="238" r="121" fill="#e8f9fa" opacity=".65"/><g fill="none" stroke-linecap="round"><path d="M350 211 C445 158 560 158 663 211" stroke="#d8eced" stroke-width="4"/><path class="connection " d="M350 211 C445 158 560 158 663 211" stroke="#29bd79" stroke-width="2.5"/></g><circle class="signal " r="6" fill="#29bd79"><animateMotion dur="2.8s" repeatCount="indefinite" path="M350 211 C445 158 560 158 663 211" keyPoints="0;1" keyTimes="0;1" calcMode="linear" begin="0s"/></circle><g fill="none" stroke-linecap="round"><path d="M350 244 C453 218 558 218 663 244" stroke="#d8eced" stroke-width="4"/><path class="connection reverse" d="M350 244 C453 218 558 218 663 244" stroke="#46acec" stroke-width="2.5"/></g><circle class="signal inbound" r="6" fill="#46acec"><animateMotion dur="3.2s" repeatCount="indefinite" path="M350 244 C453 218 558 218 663 244" keyPoints="1;0" keyTimes="0;1" calcMode="linear" begin="-1.1s"/></circle><g fill="none" stroke-linecap="round"><path d="M350 275 C445 324 565 324 663 275" stroke="#d8eced" stroke-width="4"/><path class="connection " d="M350 275 C445 324 565 324 663 275" stroke="#29bd79" stroke-width="2.5"/></g><circle class="signal bottom" r="6" fill="#29bd79"><animateMotion dur="2.8s" repeatCount="indefinite" path="M350 275 C445 324 565 324 663 275" keyPoints="0;1" keyTimes="0;1" calcMode="linear" begin="-2s"/></circle><g class="phone"><rect x="151" y="77" width="175" height="326" rx="33" fill="url(#phone-body)"/><rect x="160" y="86" width="157" height="308" rx="26" fill="url(#screen)"/><rect x="209" y="94" width="59" height="13" rx="6.5" fill="#203a4a"/><circle cx="238" cy="376" r="5" fill="#a3cbd0"/><circle cx="238" cy="171" r="48" fill="#fff" opacity=".84"/><circle cx="238" cy="171" r="37" fill="#d8f4fc"/><path d="M220 172l34-18-8 38-12-12-10 7 3-14z" fill="#229ed9"/><rect x="182" y="246" width="112" height="9" rx="4.5" fill="#c8e7ea"/><rect x="195" y="265" width="86" height="7" rx="3.5" fill="#d7ebed"/><rect x="194" y="303" width="88" height="36" rx="18" fill="#d4f3e7"/><circle cx="212" cy="321" r="8" fill="#29bd79"/><path d="M208 321l3 3 5-6" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="318" width="37" height="6" rx="3" fill="#57bd98"/></g><g class="server"><rect x="680" y="89" width="159" height="302" rx="22" fill="url(#server-body)" stroke="#253a4c" stroke-width="2"/><rect x="695" y="104" width="129" height="57" rx="10" fill="url(#server-bay)" stroke="#304658"/><rect x="711" y="119" width="53" height="5" rx="2.5" fill="#344b5d"/><rect x="711" y="131" width="37" height="5" rx="2.5" fill="#344b5d"/><rect x="695" y="171" width="129" height="57" rx="10" fill="url(#server-bay)" stroke="#304658"/><rect x="711" y="186" width="53" height="5" rx="2.5" fill="#344b5d"/><rect x="711" y="198" width="37" height="5" rx="2.5" fill="#344b5d"/><rect x="695" y="238" width="129" height="57" rx="10" fill="url(#server-bay)" stroke="#304658"/><rect x="711" y="253" width="53" height="5" rx="2.5" fill="#344b5d"/><rect x="711" y="265" width="37" height="5" rx="2.5" fill="#344b5d"/><rect x="695" y="305" width="129" height="57" rx="10" fill="url(#server-bay)" stroke="#304658"/><rect x="711" y="320" width="53" height="5" rx="2.5" fill="#344b5d"/><rect x="711" y="332" width="37" height="5" rx="2.5" fill="#344b5d"/><g><circle class="light" cx="785" cy="132" r="6" fill="#43ff91"/><circle class="light" cx="804" cy="132" r="6" fill="#43ff91"/><circle class="light" cx="785" cy="199" r="6" fill="#43ff91"/><circle class="light" cx="804" cy="199" r="6" fill="#ffad38"/><circle class="light" cx="785" cy="266" r="6" fill="#43ff91"/><circle class="light" cx="804" cy="266" r="6" fill="#46baff"/><circle class="light" cx="785" cy="333" r="6" fill="#43ff91"/><circle class="light" cx="804" cy="333" r="6" fill="#ff625d"/></g><rect x="701" y="371" width="117" height="5" rx="2.5" fill="#426074" opacity=".65"/></g><g class="lock"><circle cx="506" cy="242" r="32" fill="#fff" stroke="#ccece1" stroke-width="2"/><circle cx="506" cy="242" r="27" fill="#e7f9f1"/><path d="M496 239v-6a10 10 0 0 1 20 0v6" fill="none" stroke="#188b6d" stroke-width="3.5" stroke-linecap="round"/><rect x="491" y="238" width="30" height="23" rx="5" fill="#23bd80"/><circle cx="506" cy="248" r="2.5" fill="white"/><path d="M506 250v4" stroke="white" stroke-width="2" stroke-linecap="round"/></g></svg>