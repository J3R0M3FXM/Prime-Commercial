<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Secure phone and server connection</title><desc id="desc">A dotted connection moves back and forth between a Telegram phone and a dark server with blinking lights, protected by a shield and lock.</desc>
<style>
.phone{animation:float 4s ease-in-out infinite}.server{animation:float 5s ease-in-out -1.5s infinite}
.cloud-back{animation:cloud-drift 12s ease-in-out infinite alternate}.cloud-front{animation:cloud-drift 9s ease-in-out -4s infinite alternate-reverse}
.connection{stroke-dasharray:1 48;animation:flow 1.8s ease-in-out infinite alternate}
.light{animation:blink 2.2s ease-in-out infinite;filter:url(#light-glow)}.light:nth-child(2n){animation-delay:-.8s}.light:nth-child(3n){animation-delay:-1.6s}.light:nth-child(5n){animation-duration:3.1s}
.lock{animation:pulse 3s ease-in-out infinite;transform-origin:505px 241px}
@keyframes cloud-drift{from{transform:translate(-24px,8px)}to{transform:translate(24px,-8px)}}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-72}}@keyframes blink{0%,100%{opacity:1}43%{opacity:.22}56%{opacity:1}73%{opacity:.46}}@keyframes pulse{50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.phone,.server,.connection,.light,.lock,.cloud-back,.cloud-front{animation:none!important}}
</style>
<defs>
<linearGradient id="phone-body" x2="1" y2="1"><stop stop-color="#334e60"/><stop offset="1" stop-color="#112b3c"/></linearGradient>
<linearGradient id="screen" x2="1" y2="1"><stop stop-color="#f4fcff"/><stop offset="1" stop-color="#dcf3f7"/></linearGradient>
<linearGradient id="server-body" x2="1" y2="1"><stop stop-color="#152334"/><stop offset=".55" stop-color="#0b1625"/><stop offset="1" stop-color="#050d19"/></linearGradient>
<linearGradient id="server-bay" x2="1" y2="1"><stop stop-color="#1b2d40"/><stop offset="1" stop-color="#0c1928"/></linearGradient>
<filter id="shadow" x="-40%" y="-50%" width="180%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
<filter id="light-glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<!-- Broad cloud silhouettes sit behind every part of the connection scene. -->
<g class="cloud-back" fill="#e7f4f9" opacity=".9">
<path d="M-60 350 C-110 296 -60 221 24 225 C-8 149 60 89 139 110 C154 29 271 6 323 78 C385 10 505 31 521 108 C591 48 700 64 724 140 C796 83 901 119 907 197 C1000 170 1070 230 1050 310 C1117 370 1050 455 970 440 H22 C-56 453 -112 400 -60 350Z"/>
</g>
<g class="cloud-front" fill="#f1f9fc" opacity=".95">
<path d="M-100 374 C-103 311 -36 277 24 303 C33 242 112 208 163 250 C206 188 298 193 329 259 C394 216 469 242 487 299 C546 248 627 258 653 315 C704 255 799 260 827 322 C889 271 973 290 991 346 C1064 330 1119 383 1093 439 C1047 486 977 477 909 477 H-10 C-93 480 -140 422 -100 374Z"/>
</g>
<ellipse cx="240" cy="411" rx="114" ry="17" fill="#6999a6" opacity=".12" filter="url(#shadow)"/><ellipse cx="758" cy="411" rx="128" ry="17" fill="#456478" opacity=".16" filter="url(#shadow)"/><path class="connection" d="M340 242 H668" fill="none" stroke="#29bd79" stroke-width="27" stroke-linecap="round"/><g class="phone"><rect x="151" y="77" width="175" height="326" rx="33" fill="url(#phone-body)"/><rect x="160" y="86" width="157" height="308" rx="26" fill="url(#screen)"/><rect x="209" y="94" width="59" height="13" rx="6.5" fill="#203a4a"/><circle cx="238" cy="376" r="5" fill="#a3cbd0"/><circle cx="238" cy="171" r="48" fill="#fff" opacity=".84"/><circle cx="238" cy="171" r="37" fill="#d8f4fc"/><path d="M220 172l34-18-8 38-12-12-10 7 3-14z" fill="#229ed9"/><rect x="182" y="246" width="112" height="9" rx="4.5" fill="#c8e7ea"/><rect x="195" y="265" width="86" height="7" rx="3.5" fill="#d7ebed"/><rect x="194" y="303" width="88" height="36" rx="18" fill="#d4f3e7"/><circle cx="212" cy="321" r="8" fill="#29bd79"/><path d="M208 321l3 3 5-6" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="228" y="318" width="37" height="6" rx="3" fill="#57bd98"/></g><g class="server"><rect x="680" y="89" width="159" height="302" rx="22" fill="url(#server-body)" stroke="#253a4c" stroke-width="2"/><rect x="695" y="104" width="129" height="57" rx="10" fill="url(#server-bay)" stroke="#304658"/><rect x="711" y="119" width="53" height="5" rx="2.5" fill="#344b5d"/><rect x="711" y="131" width="37" height="5" rx="2.5" fill="#344b5d"/><rect x="695" y="171" width="129" height="57" rx="10" fill="url(#server-bay)" stroke="#304658"/><rect x="711" y="186" width="53" height="5" rx="2.5" fill="#344b5d"/><rect x="711" y="198" width="37" height="5" rx="2.5" fill="#344b5d"/><rect x="695" y="238" width="129" height="57" rx="10" fill="url(#server-bay)" stroke="#304658"/><rect x="711" y="253" width="53" height="5" rx="2.5" fill="#344b5d"/><rect x="711" y="265" width="37" height="5" rx="2.5" fill="#344b5d"/><rect x="695" y="305" width="129" height="57" rx="10" fill="url(#server-bay)" stroke="#304658"/><rect x="711" y="320" width="53" height="5" rx="2.5" fill="#344b5d"/><rect x="711" y="332" width="37" height="5" rx="2.5" fill="#344b5d"/><g><circle class="light" cx="785" cy="132" r="6" fill="#43ff91"/><circle class="light" cx="804" cy="132" r="6" fill="#43ff91"/><circle class="light" cx="785" cy="199" r="6" fill="#43ff91"/><circle class="light" cx="804" cy="199" r="6" fill="#ffad38"/><circle class="light" cx="785" cy="266" r="6" fill="#43ff91"/><circle class="light" cx="804" cy="266" r="6" fill="#46baff"/><circle class="light" cx="785" cy="333" r="6" fill="#43ff91"/><circle class="light" cx="804" cy="333" r="6" fill="#ff625d"/></g><rect x="701" y="371" width="117" height="5" rx="2.5" fill="#426074" opacity=".65"/></g><g class="lock">
<path class="shield" d="M506 193 L542 207 V237 C542 262 526 281 506 291 C486 281 470 262 470 237 V207 Z" fill="#fff" stroke="#bce6d6" stroke-width="3" stroke-linejoin="round"/>
<path d="M506 201 L535 213 V237 C535 257 523 273 506 282 C489 273 477 257 477 237 V213 Z" fill="#e7f9f1"/>
<path d="M496 238v-7a10 10 0 0 1 20 0v7" fill="none" stroke="#188b6d" stroke-width="3.5" stroke-linecap="round"/>
<rect x="491" y="237" width="30" height="25" rx="5" fill="#23bd80"/>
<circle cx="506" cy="247" r="2.5" fill="white"/><path d="M506 249v5" stroke="white" stroke-width="2" stroke-linecap="round"/>
</g></svg>