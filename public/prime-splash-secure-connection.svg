dth=".9"/><rect x="675" y="254.14" width="38" height="5" rx="2.5" fill="#3b5e93"/><rect x="688" y="263.14" width="25" height="5" rx="2.5" fill="#3b5e93"/><g><circle class="light" style="--blink-pattern:blink-a;--blink-duration:2.432s;--blink-delay:-2.488s" cx="657" cy="260.14" r="5" fill="#ff625d"/><circle class="light" style="--blink-pattern:blink-b;--blink-duration:2.569s;--blink-delay:-2.871s" cx="671" cy="260.14" r="5" fill="#8bdb22"/></g><rect x="647" y="280" width="85" height="5" rx="2.5" fill="#234e89"/></g><g class="server server-right"><rect x="766" y="128" width="117" height="169" rx="19" fill="url(#server-body)" stroke="#3374cc" stroke-width="1.2"/><rect x="771" y="133" width="107" height="159" rx="15" fill="#031b47" opacity=".55"/><rect x="778" y="141.0" width="93" height="43.00" rx="6" fill="url(#server-bay)" stroke="#255ca2" stroke-width=".9"/><rect x="788" y="155.21" width="38" height="5" rx="2.5" fill="#3b5e93"/><rect x="788" y="164.21" width="25" height="5" rx="2.5" fill="#3b5e93"/><g><circle class="light" style="--blink-pattern:blink-c;--blink-duration:2.706s;--blink-delay:-3.254s" cx="843" cy="161.21" r="5" fill="#43ff91"/><circle class="light" style="--blink-pattern:blink-a;--blink-duration:2.843s;--blink-delay:-3.637s" cx="857" cy="161.21" r="5" fill="#43ff91"/></g><rect x="778" y="190.0" width="93" height="43.00" rx="6" fill="url(#server-bay)" stroke="#255ca2" stroke-width=".9"/><rect x="788" y="204.21" width="38" height="5" rx="2.5" fill="#3b5e93"/><rect x="788" y="213.21" width="25" height="5" rx="2.5" fill="#3b5e93"/><g><circle class="light" style="--blink-pattern:blink-b;--blink-duration:2.980s;--blink-delay:-4.020s" cx="843" cy="210.21" r="5" fill="#43ff91"/><circle class="light" style="--blink-pattern:blink-c;--blink-duration:3.117s;--blink-delay:-4.403s" cx="857" cy="210.21" r="5" fill="#43ff91"/></g><rect x="778" y="239.0" width="93" height="43.00" rx="6" fill="url(#server-bay)" stroke="#255ca2" stroke-width=".9"/><rect x="788" y="253.2